---
- name: Прочитать учётные записи
  ansible.builtin.command:
    argv: [awk, "-F:", "{ print $1 \":\" $3 \":\" $7 }", /etc/passwd]
  register: host_audit_passwd
  changed_when: false
  failed_when: false

- name: Классифицировать пароли в shadow
  ansible.builtin.command:
    argv:
      - awk
      - -F:
      - '{ cls="set"; if ($2 == "") cls="empty"; else if ($2 ~ /^[!*]/) cls="locked"; print $1 ":" cls }'
      - /etc/shadow
  register: host_audit_shadow_class
  changed_when: false
  failed_when: false

- name: Зафиксировать SVC-01
  ansible.builtin.set_fact:
    host_audit_controls: "{{ host_audit_controls + [host_audit_one] }}"
  vars:
    host_audit_one: "{{ checks | host_audit_control('SVC-01', title, 'high', requirement, remediation) }}"
    checks: >-
      {{
        host_audit_packages | host_audit_surface_checks(
          host_audit_services,
          accounts,
          host_audit_forbidden_packages,
          host_audit_forbidden_services,
          host_audit_demo_accounts
        )
      }}
    accounts: >-
      {{
        (host_audit_passwd.stdout | default('')) | host_audit_accounts(host_audit_shadow_class.stdout | default(''))
      }}
    title: "Нет лишних сервисов, пакетов и демо-учёток"
    requirement: Запрещённые пакеты и сервисы отсутствуют, демо-учётки заблокированы, UID 0 только у root.
    remediation: >-
      Удалите пакеты из host_audit_forbidden_packages, выключите сервисы из списка
      и переведите демо-учётки на nologin с заблокированным паролем.
